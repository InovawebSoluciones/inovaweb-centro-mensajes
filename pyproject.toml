[project]
name = "inovaweb-centro-mensajes"
version = "0.1.0"
description = "Centro de mensajes multi-canal (Email, WhatsApp, SMS) - core nivel 1 de la arquitectura Inovaweb"
readme = "CLAUDE.md"
requires-python = ">=3.12"
authors = [
    { name = "Inovaweb", email = "conrado.torres@inovaweb.com.mx" },
]
license = { text = "Proprietary" }

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",

    # Base de datos
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2.3",

    # Cliente HTTP (proveedores externos + finanzas-core)
    "httpx>=0.27.2",

    # Cifrado de credenciales de proveedores (AES-256-GCM) y hashing (SHA-256)
    "cryptography>=43.0.1",

    # Rate limiting opcional (graceful degradation si no hay Redis)
    "redis>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "httpx>=0.27.2",  # tambien usado por TestClient
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.core", "app.providers", "app.routers", "app.workers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
