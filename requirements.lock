#
# requirements.lock — pinning de versiones para reproducibilidad de build.
#
# Generado con pip-compile (pip-tools) sobre pyproject.toml.
# Garantiza que cada `docker compose build` instale exactamente las mismas
# versiones, evitando deriva por nuevos releases upstream.
#
# IMPORTANTE para criticidad bancaria:
#   Este lockfile NO incluye hashes (--generate-hashes). Eso significa que
#   pinea VERSIONES exactas pero no detecta sustitucion maliciosa del mismo
#   numero de version en PyPI.
#
#   Antes del deploy productivo FINAL, regenerar este archivo en una caja
#   con Python 3.12 ejecutando:
#       pip install pip-tools
#       pip-compile --generate-hashes --resolver=backtracking \
#                   --output-file=requirements.lock pyproject.toml
#   y validar el diff (versiones no deberian cambiar; solo se agregaran
#   bloques --hash=sha256:...).
#
